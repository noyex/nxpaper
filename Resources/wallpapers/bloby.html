<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bloby</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// A few very soft dark colored blobs drifting over black. Peak brightness ~35%, dithered.
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'low-power'});

const vs = `
attribute vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

const fs = `
precision highp float;
uniform float t;
uniform vec2 res;
uniform float dpr;

float hash(vec2 p){ p = fract(p * vec2(0.1031, 0.1030)); p += dot(p, p.yx + 33.33); return fract((p.x + p.y) * p.x); }

// soft blob: smooth falloff, peaks at 1
float blob(vec2 uv, vec2 c, vec2 r){
  vec2 d = (uv - c) / r;
  float q = dot(d, d);
  return exp(-q * 2.4);
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * res) / res.y;   // y in -0.5..0.5, x scales with aspect
  float ax = res.x / res.y * 0.5;
  float k = 0.045;                                    // global drift speed
  vec2 c1 = vec2(-0.55 * ax + 0.20 * sin(t * k * 1.3 + 0.5),  0.10 * sin(t * k * 1.7 + 1.0) + 0.05);
  vec2 c2 = vec2( 0.25 * ax + 0.25 * sin(t * k * 0.9 + 2.0),  0.18 * cos(t * k * 1.1 + 0.3) - 0.05);
  vec2 c3 = vec2( 0.70 * ax + 0.15 * cos(t * k * 1.2 + 4.0), -0.15 + 0.15 * sin(t * k * 1.4 + 2.5));
  vec2 c4 = vec2(-0.10 * ax + 0.30 * cos(t * k * 0.7 + 1.5), -0.30 + 0.10 * sin(t * k * 1.6));
  vec2 c5 = vec2( 0.45 * ax + 0.20 * sin(t * k * 0.8 + 5.0),  0.30 + 0.08 * cos(t * k * 1.2 + 3.0));
  vec3 col = vec3(0.0);
  col += vec3(0.05, 0.15, 1.00) * blob(uv, c1, vec2(0.55, 0.40)) * (0.85 + 0.15 * sin(t * 0.07));   // deep blue
  col += vec3(0.55, 0.15, 1.00) * blob(uv, c2, vec2(0.50, 0.42)) * (0.85 + 0.15 * sin(t * 0.06 + 2.0)); // violet
  col += vec3(0.00, 0.80, 0.80) * blob(uv, c3, vec2(0.45, 0.32)) * (0.85 + 0.15 * sin(t * 0.05 + 4.0)); // teal
  col += vec3(0.05, 0.20, 0.95) * blob(uv, c4, vec2(0.60, 0.22)) * 0.7;                                   // blue floor glow
  col += vec3(1.00, 0.10, 0.60) * blob(uv, c5, vec2(0.22, 0.17)) * (0.55 + 0.25 * sin(t * 0.08 + 1.0));  // magenta touch
  col *= 0.42;
  float m = max(col.r, max(col.g, col.b));
  col = 0.35 * (1.0 - exp(-col / 0.35 * 1.4)) / (1.0 - exp(-1.4));   // soft shoulder, never above 35%
  col = min(col, vec3(0.35));
  // triangular dither to avoid banding, only where there is light so black stays pure
  float n = hash(gl_FragCoord.xy) + hash(gl_FragCoord.xy + 17.7) - 1.0;
  col += n / 255.0 * smoothstep(0.0, 0.01, m);
  gl_FragColor = vec4(col, 1.0);
}`;

function sh(type, src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

const uT = gl.getUniformLocation(prog, 't'), uRes = gl.getUniformLocation(prog, 'res'), uDpr = gl.getUniformLocation(prog, 'dpr');
gl.clearColor(0, 0, 0, 1);

function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  gl.uniform2f(uRes, w, h);
  gl.uniform1f(uDpr, dpr);
}

const params = new URLSearchParams(location.search);
const FPS = Number(params.get('fps')) || 30;
// optional fixed time for stills: ?t=12
const fixedT = params.has('t') ? Number(params.get('t')) : null;
// each screen starts at a different moment so the two monitors don't mirror each other
let t = fixedT ?? (10 + Math.random() * 600), last = performance.now(), acc = 0, running = true;

function frame(now){
  if (!running) return;
  const dt = Math.min(now - last, 100) / 1000; last = now; acc += dt;
  if (acc >= 1 / FPS - 0.002) {
    if (fixedT === null) t += acc;
    acc = 0;
    resize();
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uT, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
}

// called by the macOS host app
window.setPaused = p => {
  if (p === !running) return;
  running = !p;
  if (running) { last = performance.now(); requestAnimationFrame(frame); }
};
requestAnimationFrame(frame);
</script>
</body>
</html>
