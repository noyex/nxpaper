<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pole</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Vector field plot: a grid of short strokes following the curl of a drifting noise field.
// Stronger flow draws longer, brighter strokes; the fastest currents turn blue.
const vs = `
attribute vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
const fs = `
precision highp float;
uniform float t;
uniform vec2 res;
float hash(vec2 p){ p = fract(p * vec2(0.1031, 0.1030)); p += dot(p, p.yx + 33.33); return fract((p.x + p.y) * p.x); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  return mix(mix(hash(i), hash(i + vec2(1,0)), u.x), mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
}
float psi(vec2 p){
  return 0.65 * vnoise(p + vec2(t * 0.020, -t * 0.013))
       + 0.35 * vnoise(p * 2.1 + vec2(-t * 0.017, t * 0.024) + 11.0);
}
void main(){
  float u = res.y / 1000.0;
  vec2 q = gl_FragCoord.xy / u;              // screen in units, 1000 = height
  const float S = 26.0;
  vec2 c = (floor(q / S) + 0.5) * S;
  vec2 np = c * 0.0026;
  const float e = 0.03;
  vec2 g = vec2(psi(np + vec2(e, 0.0)) - psi(np - vec2(e, 0.0)),
                psi(np + vec2(0.0, e)) - psi(np - vec2(0.0, e))) / (2.0 * e);
  vec2 v = vec2(g.y, -g.x);
  float m = length(v);
  float mag = smoothstep(0.05, 1.8, m);
  vec2 dir = v / max(m, 1e-4);
  float L = S * (0.10 + 0.32 * mag);
  vec2 d = q - c;
  float h = clamp(dot(d, dir), -L, L);
  float dist = length(d - dir * h);
  float px = 1.0 / u;                        // one device pixel in units
  float w = max(0.55, 0.5 * px);
  float line = 1.0 - smoothstep(w, w + px, dist);
  float b = 0.10 + 0.85 * mag * mag;
  vec3 col = mix(vec3(0.86), vec3(0.30, 0.58, 1.0), smoothstep(0.90, 1.0, mag));
  gl_FragColor = vec4(col * b * line, 1.0);
}`;
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'low-power'});

function sh(type, src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);
const uT = gl.getUniformLocation(prog, 't'), uRes = gl.getUniformLocation(prog, 'res');
function attrib(name, data, size){
  const loc = gl.getAttribLocation(prog, name);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
}
gl.clearColor(0, 0, 0, 1);

attrib('a', new Float32Array([-1,-1, 3,-1, -1,3]), 2);
function draw(){ gl.drawArrays(gl.TRIANGLES, 0, 3); }

function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  gl.uniform2f(uRes, w, h);
}

const params = new URLSearchParams(location.search);
const FPS = Number(params.get('fps')) || 30;
// optional fixed time for stills: ?t=12
const fixedT = params.has('t') ? Number(params.get('t')) : null;
// each screen starts at a different moment so the two monitors don't mirror each other
let t = fixedT ?? (10 + Math.random() * 600), last = performance.now(), acc = 0, running = true;

function frame(now){
  if (!running) return;
  const dt = Math.min(now - last, 100) / 1000; last = now; acc += dt;
  if (acc >= 1 / FPS - 0.002) {
    if (fixedT === null) t += acc;
    acc = 0;
    resize();
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uT, t);
    draw(t);
  }
  requestAnimationFrame(frame);
}

// called by the macOS host app
window.setPaused = p => {
  if (p === !running) return;
  running = !p;
  if (running) { last = performance.now(); requestAnimationFrame(frame); }
};
requestAnimationFrame(frame);
</script>
</body>
</html>
