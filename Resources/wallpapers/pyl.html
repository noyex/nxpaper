<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pył</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Dust drifting in a light beam. Positions are closed-form in the vertex shader, no per-frame JS work.
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'low-power'});

const N = 10000;
const vs = `
attribute vec3 a;               // per-particle seed in 0..1
uniform float t;
uniform vec2 res;
uniform float dpr;
varying float vA;
varying vec3 vCol;
float h1(float x){ return fract(sin(x * 127.1) * 43758.5453); }
void main(){
  float u = res.y / 1000.0;
  float z = a.z;                                   // depth: 0 far, 1 near
  float ar = res.x / res.y;
  float sp = 0.006 + 0.016 * z;                    // near dust drifts faster (parallax)
  vec2 p = a.xy;
  // smooth closed-form swirl: sum of sines gives a divergence-free-looking flow
  float ph = t * 0.11;
  vec2 fl = vec2(
    sin(p.y * 5.0 + ph + a.x * 2.0) + 0.6 * sin(p.y * 11.0 - ph * 1.3 + z * 6.0),
    cos(p.x * 4.0 - ph * 0.9 + a.y * 2.0) + 0.6 * cos(p.x * 9.0 + ph * 1.1 + z * 4.0));
  p += vec2(0.7, -0.35) * sp * t;                  // global drift (wind through the beam)
  p += fl * (0.02 + 0.03 * z);
  p = fract(p * 1.06) * 1.06 - 0.03;               // wrap with margin, wraps happen offscreen
  vec2 s = p;
  gl_Position = vec4(s * 2.0 - 1.0, 0.0, 1.0);
  // light beam: a soft diagonal band that slowly sways
  vec2 q = (s - 0.5) * vec2(ar, 1.0);
  float ang = 0.55 + 0.12 * sin(t * 0.03);
  float b = dot(q, vec2(-sin(ang), cos(ang))) + 0.06 * sin(t * 0.04);
  float beam = exp(-b * b * 11.0);
  float tw = 0.65 + 0.35 * sin(t * (0.25 + 0.5 * h1(a.x + a.y)) + a.x * 40.0);   // slow shimmer
  float edge = smoothstep(0.0, 0.04, s.x) * smoothstep(1.0, 0.96, s.x) * smoothstep(0.0, 0.04, s.y) * smoothstep(1.0, 0.96, s.y);
  vA = (0.04 + 2.0 * beam) * (0.3 + 0.7 * z) * tw * edge;
  vCol = mix(vec3(0.85, 0.9, 1.0), vec3(1.0, 0.92, 0.78), beam);
  gl_PointSize = max(1.0, (1.3 + 3.2 * z * z) * u + 0.5);
}`;
const fs = `
precision mediump float;
varying float vA;
varying vec3 vCol;
void main(){
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float d = dot(p, p);
  if (d > 1.0) discard;
  float e = 1.0 - smoothstep(0.1, 1.0, d);
  gl_FragColor = vec4(vCol * vA * e, 1.0);
}`;

function sh(type, src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const seeds = new Float32Array(N * 3);
for (let i = 0; i < N * 3; i++) seeds[i] = Math.random();
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 3, gl.FLOAT, false, 0, 0);
// additive blending: overlapping specks brighten
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE);

const uT = gl.getUniformLocation(prog, 't'), uRes = gl.getUniformLocation(prog, 'res'), uDpr = gl.getUniformLocation(prog, 'dpr');
gl.clearColor(0, 0, 0, 1);

function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  gl.uniform2f(uRes, w, h);
  gl.uniform1f(uDpr, dpr);
}

const params = new URLSearchParams(location.search);
const FPS = Number(params.get('fps')) || 30;
// optional fixed time for stills: ?t=12
const fixedT = params.has('t') ? Number(params.get('t')) : null;
// each screen starts at a different moment so the two monitors don't mirror each other
let t = fixedT ?? (10 + Math.random() * 600), last = performance.now(), acc = 0, running = true;

function frame(now){
  if (!running) return;
  const dt = Math.min(now - last, 100) / 1000; last = now; acc += dt;
  if (acc >= 1 / FPS - 0.002) {
    if (fixedT === null) t += acc;
    acc = 0;
    resize();
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uT, t);
    gl.drawArrays(gl.POINTS, 0, N);
  }
  requestAnimationFrame(frame);
}

// called by the macOS host app
window.setPaused = p => {
  if (p === !running) return;
  running = !p;
  if (running) { last = performance.now(); requestAnimationFrame(frame); }
};
requestAnimationFrame(frame);
</script>
</body>
</html>
