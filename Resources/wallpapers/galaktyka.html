<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Galaktyka</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'low-power'});
// Spiral galaxy of dots seen at a tilt. Particle layout is generated once in JS;
// rotation, tilt, twinkle and colour all run in the vertex shader.
// Pure black background (OLED friendly): every dot orbits or twinkles, nothing static is drawn.
const N = 16000;
const STRIDE = 4;
const vs = `
attribute vec4 a;               // x: radius 0..1, y: base angle, z: height off the disc, w: seed
uniform float t;
uniform vec2 res;
varying vec3 vCol;
varying float vA;
void main(){
  float u = res.y / 1000.0;
  float r = a.x, seed = a.w;
  float ang = a.y + t * 0.035;                 // rigid, very slow rotation
  vec2 q = vec2(cos(ang), sin(ang)) * r;
  // tilt: squash the disc into an ellipse and roll it a little
  float R = res.y * 0.98;
  float tilt = 0.40;
  vec2 e = vec2(q.x, q.y * tilt + a.z * 0.9);
  float rot = -0.28, cr = cos(rot), sr = sin(rot);
  e = vec2(e.x * cr - e.y * sr, e.x * sr + e.y * cr);
  float px = res.x * 0.5 + e.x * R;
  float py = res.y * 0.45 + e.y * R;
  gl_Position = vec4(px / res.x * 2.0 - 1.0, 1.0 - py / res.y * 2.0, 0.0, 1.0);

  float core = exp(-r * 7.0);
  vec3 warm = vec3(1.0, 0.72, 0.42);
  vec3 cool = vec3(0.70, 0.80, 1.0);
  vec3 col = mix(cool, warm, smoothstep(0.0, 0.7, core * 1.6 + 0.0));
  // a few coloured dots: pink, cyan, amber
  float cs = fract(seed * 91.7);
  if (cs > 0.965) col = vec3(1.0, 0.35, 0.6);
  else if (cs > 0.93) col = vec3(0.3, 0.85, 1.0);
  else if (cs > 0.90) col = vec3(1.0, 0.6, 0.2);
  vCol = col;

  float tw = 0.7 + 0.3 * sin(t * (0.5 + seed * 1.5) + seed * 80.0);
  float edge = 1.0 - smoothstep(0.8, 1.0, r);
  vA = (0.2 + 0.2 * core + 0.2 * fract(seed * 13.3)) * tw * edge;
  gl_PointSize = max(1.0, 2.0 * (0.7 + 1.1 * fract(seed * 37.1) + 0.5 * core) * u);
}`;
const fs = `
precision mediump float;
varying vec3 vCol;
varying float vA;
void main(){
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float d = dot(p, p);
  if (d > 1.0) discard;
  float edge = 1.0 - smoothstep(0.3, 1.0, d);
  gl_FragColor = vec4(vCol * vA * edge, 1.0);
}`;

function gauss(){ return (Math.random() + Math.random() + Math.random() + Math.random() - 2) * 0.9; }
const pts = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  const bulge = i < N * 0.15;
  let r, ang, z;
  if (bulge) {
    r = Math.abs(gauss()) * 0.2;
    ang = Math.random() * Math.PI * 2;
    z = gauss() * 0.05;
  } else {
    // exponential-ish disc, two logarithmic arms with scatter
    r = Math.min(1, 0.05 - Math.log(1 - Math.random() * 0.96) * 0.33);
    const arm = Math.random() < 0.5 ? 0 : Math.PI;
    ang = arm + r * 7.0 + gauss() * (0.2 + 0.25 * r) + (Math.random() < 0.38 ? Math.random() * 6.28 : 0);
    z = gauss() * 0.02 * (1.2 - r);
  }
  pts[i * 4] = r; pts[i * 4 + 1] = ang; pts[i * 4 + 2] = z; pts[i * 4 + 3] = Math.random();
}

function sh(type, src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, pts, gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, STRIDE, gl.FLOAT, false, 0, 0);
const uT = gl.getUniformLocation(prog, 't'), uRes = gl.getUniformLocation(prog, 'res');

// additive blending: overlapping dots brighten instead of hiding each other
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE);
gl.clearColor(0, 0, 0, 1);

function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  gl.uniform2f(uRes, w, h);
}

const params = new URLSearchParams(location.search);
const FPS = Number(params.get('fps')) || 30;
// optional fixed time for stills: ?t=12
const fixedT = params.has('t') ? Number(params.get('t')) : null;
// each screen starts at a different moment so the two monitors don't mirror each other
let t = fixedT ?? (10 + Math.random() * 600), last = performance.now(), acc = 0, running = true;

function frame(now){
  if (!running) return;
  const dt = Math.min(now - last, 100) / 1000; last = now; acc += dt;
  if (acc >= 1 / FPS - 0.002) {
    if (fixedT === null) t += acc;
    acc = 0;
    resize();
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uT, t);
    gl.drawArrays(gl.POINTS, 0, pts.length / STRIDE);
  }
  requestAnimationFrame(frame);
}

// called by the macOS host app
window.setPaused = p => {
  if (p === !running) return;
  running = !p;
  if (running) { last = performance.now(); requestAnimationFrame(frame); }
};
requestAnimationFrame(frame);
</script>
</body>
</html>
